version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codesage
    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus

    container_name: codesage-prometheus

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana

    container_name: codesage-grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus