name: CodeSage Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements.txt

      - name: Unit Tests
        run: |
          pytest

      - name: Evaluation
        run: |
          python scripts/evaluate.py